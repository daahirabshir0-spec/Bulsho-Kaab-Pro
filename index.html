<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulsho Kaab Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 pb-20">

    <!-- Header -->
    <header class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <button id="backBtn" class="hidden font-bold text-emerald-800 text-xl" onclick="showView('homeView')">←</button>
            <h1 id="viewTitle" class="font-bold text-emerald-900 text-lg">Bulsho Kaab Pro</h1>
        </div>
        <div class="text-sm font-bold bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">USD</div>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <!-- Home Dashboard -->
        <div id="homeView" class="grid grid-cols-2 gap-4">
            <div onclick="showView('customersView')" class="bg-white p-6 rounded-2xl shadow-sm border text-center cursor-pointer hover:border-emerald-500">
                <div class="text-3xl mb-2">👥</div>
                <h3 class="font-bold">Macaamiisha</h3>
            </div>
            <div onclick="showView('invoicesView')" class="bg-white p-6 rounded-2xl shadow-sm border text-center cursor-pointer hover:border-emerald-500">
                <div class="text-3xl mb-2">📄</div>
                <h3 class="font-bold">Invoice-yada</h3>
            </div>
            <div onclick="showView('productsView')" class="bg-white p-6 rounded-2xl shadow-sm border text-center cursor-pointer hover:border-emerald-500">
                <div class="text-3xl mb-2">📦</div>
                <h3 class="font-bold">Alaabta</h3>
            </div>
            <div onclick="showView('expensesView')" class="bg-white p-6 rounded-2xl shadow-sm border text-center cursor-pointer hover:border-emerald-500">
                <div class="text-3xl mb-2">🧾</div>
                <h3 class="font-bold">Kharashaad</h3>
            </div>
        </div>

        <!-- Views Container -->
        <div id="customersView" class="hidden">
            <h2 class="text-xl font-bold mb-4">Macaamiisha</h2>
            <button onclick="alert('Ku dar macmiil cusub')" class="w-full bg-emerald-600 text-white py-3 rounded-xl mb-4">+ Ku dar macmiil</button>
            <div id="customersList" class="space-y-2"></div>
        </div>

        <div id="invoicesView" class="hidden">
            <h2 class="text-xl font-bold mb-4">Invoice-yada</h2>
            <button onclick="alert('Ku dar invoice cusub')" class="w-full bg-blue-600 text-white py-3 rounded-xl mb-4">+ Invoice cusub</button>
            <div id="invoicesList" class="space-y-2"></div>
        </div>
    </main>

    <script>
        // Xogta waxaa lagu keydinayaa hal meel oo kaliya (State Object)
        let state = JSON.parse(localStorage.getItem('bulsho_data')) || {
            customers: [],
            invoices: [],
            products: [],
            expenses: []
        };

        function saveData() {
            localStorage.setItem('bulsho_data', JSON.stringify(state));
        }

        function showView(viewId) {
            document.querySelectorAll('main > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            
            const backBtn = document.getElementById('backBtn');
            const title = document.getElementById('viewTitle');
            
            if(viewId === 'homeView') {
                backBtn.classList.add('hidden');
                title.innerText = "Bulsho Kaab Pro";
            } else {
                backBtn.classList.remove('hidden');
                title.innerText = viewId.replace('View', '').toUpperCase();
            }
        }

        // Bilowgii hore markuu boggu furmo
        console.log("Xogta la rartay:", state);
    </script>
</body>
</html>
