<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulsho Kaab Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f9f9; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .icon { font-size: 40px; margin-bottom: 10px; }
        .title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .subtitle { color: gray; font-size: 12px; margin-bottom: 10px; }
        .open { color: #00796B; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight:bold; font-size: 20px;">📖 Bulsho Kaab</div>
    <div style="background:#e0e0e0; padding:5px 10px; border-radius:10px;">USD | SOS</div>
</div>

<h2 style="text-align:center;">Bulsho Kaab Pro</h2>
<p style="text-align:center; color:gray;">Doorso qaybta aad rabto · Select a module to get started</p>

<div class="grid">
    <div class="card"><div class="icon">📈</div><div class="title">Iibka</div><div class="subtitle">Sales</div><div class="open">Open ></div></div>
    <div class="card"><div class="icon">👥</div><div class="title">Macaamiisha</div><div class="subtitle">Customers</div><div class="open">Open ></div></div>
    <div class="card"><div class="icon">📋</div><div class="title">Dalabka</div><div class="subtitle">Orders</div><div class="open">Open ></div></div>
    <div class="card"><div class="icon">🏢</div><div class="title">Shirkadaha</div><div class="subtitle">Companies</div><div class="open">Open ></div></div>
    <div class="card"><div class="icon">📦</div><div class="title">Alaabta</div><div class="subtitle">Products</div><div class="open">Open ></div></div>
    <div class="card"><div class="icon">🧾</div><div class="title">Kharashaad</div><div class="subtitle">Expenses</div><div class="open">Open ></div></div>
</div>

</body>
</html>
