<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulsho Kaab Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #fcfcfc; margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: white; border-bottom: 1px solid #eee; }
        .logo { font-weight: bold; color: #004d40; display: flex; align-items: center; gap: 8px; }
        .currency { display: flex; border: 1px solid #ccc; border-radius: 5px; overflow: hidden; }
        .currency button { border: none; padding: 5px 10px; cursor: pointer; background: #eee; }
        .currency .active { background: #00897b; color: white; }
        .main { padding: 20px; max-width: 600px; margin: auto; }
        h1 { color: #004d40; margin-bottom: 5px; }
        p { color: #888; font-size: 14px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .icon { width: 50px; height: 50px; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-left: auto; margin-right: auto; }
        .title { font-weight: bold; margin-top: 10px; }
        .subtitle { color: #888; font-size: 12px; margin-bottom: 10px; }
        .open { color: #00897b; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>📖</span> Bulsho Kaab</div>
    <div class="currency"><button class="active">USD</button><button>SOS</button></div>
</header>

<div class="main">
    <h1>Bulsho Kaab Pro</h1>
    <p>Doorso qaybta aad rabto · Select a module to get started</p>
    
    <div class="grid">
        <!-- Iibka -->
        <div class="card">
            <div class="icon" style="background:#e8f5e9">📈</div>
            <div class="title">libka</div>
            <div class="subtitle">Sales</div>
            <div class="open">Open ></div>
        </div>
        <!-- Macaamiisha -->
        <div class="card">
            <div class="icon" style="background:#e3f2fd">👥</div>
            <div class="title">Macaamiisha</div>
            <div class="subtitle">Customers</div>
            <div class="open">Open ></div>
        </div>
        <!-- Dalabka -->
        <div class="card">
            <div class="icon" style="background:#fff8e1">📋</div>
            <div class="title">Dalabka</div>
            <div class="subtitle">Orders</div>
            <div class="open">Open ></div>
        </div>
        <!-- Shirkadaha -->
        <div class="card">
            <div class="icon" style="background:#f3e5f5">🏢</div>
            <div class="title">Shirkadaha</div>
            <div class="subtitle">Companies</div>
            <div class="open">Open ></div>
        </div>
        <!-- Alaabta -->
        <div class="card">
            <div class="icon" style="background:#e0f2f1">📦</div>
            <div class="title">Alaabta</div>
            <div class="subtitle">Products</div>
            <div class="open">Open ></div>
        </div>
        <!-- Kharashaad -->
        <div class="card">
            <div class="icon" style="background:#ffebee">🧾</div>
            <div class="title">Kharashaad</div>
            <div class="subtitle">Expenses</div>
            <div class="open">Open ></div>
        </div>
    </div>
</div>

</body>
</html>
