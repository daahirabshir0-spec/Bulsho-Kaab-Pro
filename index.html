<!-- 4. SHIRKADAHA (HABKA BISAFI) -->
<div id="companiesView" class="view-section">
  <div class="back-link" onclick="showView('homeView')">&larr; Dib u noqo</div>
  <h3>Buugga Shirkadaha</h3>
  <input type="text" class="search-box" id="searchComp" placeholder="Raadi shirkad..." onkeyup="filterCompanies()">
  
  <div class="total-box">
      <span>Wadarta Shirkadaha:</span> <span id="compCount">0</span>
  </div>
  
  <div class="data-list" id="companiesList"></div>
  
  <div class="debt-actions-container">
    <button class="btn-submit" onclick="openAddCompanyModal()">+ KU DAR SHIRKAD</button>
  </div>
</div>

<!-- MODAL CUSUB OO LOOGU TALAGALAY DARISTA SHIRKAD -->
<div id="compModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">Ku dar Shirkad Cusub</div>
    <div class="form-group"><label>Magaca Shirkadda</label><input type="text" id="compName" placeholder="Magaca..."></div>
    <div class="form-group"><label>Magaca Masuulka</label><input type="text" id="compContact" placeholder="Magaca masuulka..."></div>
    <div class="form-group"><label>Teleefanka</label><input type="text" id="compPhone" placeholder="061xxxxxxx"></div>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn-submit" style="background: #ccc;" onclick="document.getElementById('compModal').style.display='none'">Jooji</button>
        <button class="btn-submit" onclick="saveCompany()">Keydi</button>
    </div>
  </div>
</div>
