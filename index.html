<!-- HTML-KA MODAL-KA (Ku dar meesha ay HTML-kaaga ka baxaan modal-ada kale) -->
<div id="editDebtModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
  <div class="modal-content" style="background:white; padding:20px; border-radius:10px; width:90%; max-width:400px;">
    <div class="modal-title" style="font-weight:bold; margin-bottom:15px;">Wax ka beddel Dhaqdhaqaaqa</div>
    <div class="form-group" style="margin-bottom:10px;"><label>Lacagta ($)</label><br><input type="number" id="editModalAmount" style="width:100%; padding:8px; margin-top:5px;"></div>
    <div class="form-group" style="margin-bottom:15px;"><label>Faahfaahin</label><br><input type="text" id="editModalDesc" style="width:100%; padding:8px; margin-top:5px;"></div>
    <div style="display: flex; gap: 10px;">
      <button class="btn-submit" style="flex:1; padding:8px; background: #ccc; border:none; border-radius:5px; color: #333; cursor:pointer;" onclick="document.getElementById('editDebtModal').style.display='none'">Jooji</button>
      <button class="btn-submit" style="flex:1; padding:8px; background: var(--primary, #009688); border:none; border-radius:5px; color: white; cursor:pointer;" onclick="saveEditDebt()">Keydi Isbedelka</button>
    </div>
  </div>
</div>

<script>
// QAYBTA JAVASCRIPT-KA (Waa inaad meesha ka saartaa shaqadii hore ee renderCompanyTransactions haddii ay jirto, kuna beddeshaa tan)

function renderCompanyTransactions(comp) {
  let list = document.getElementById('compTransList');
  list.innerHTML = '';
  
  comp.transactions.slice().reverse().forEach((tx) => {
    let color = tx.type === 'add' ? 'var(--danger)' : 'var(--success)';
    let sign = tx.type === 'add' ? '+' : '-';
    
    list.innerHTML += `
      <div style="background:#fafafa; padding:12px; border-radius:10px; margin-bottom:8px; border:1px solid #eee;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span style="font-size:11px; color:#888;">${tx.date}</span><br>
            <b>${tx.desc}</b>
          </div>
          <div style="color:${color}; font-weight:bold;">USD ${sign}$${parseFloat(tx.amt).toFixed(2)}</div>
        </div>
        <div style="display:flex; gap:5px; margin-top:8px;">
          <button style="flex:1; padding:5px; border:none; border-radius:4px; background:#ff9800; color:white; cursor:pointer;" onclick="openEditModal(${comp.id}, ${tx.id})">Edit</button>
          <button style="flex:1; padding:5px; border:none; border-radius:4px; background:var(--danger); color:white; cursor:pointer;" onclick="deleteCompTransaction(${comp.id}, ${tx.id})">Delete</button>
        </div>
      </div>`;
  });
}

let editingTxId = null;

function openEditModal(compId, txId) {
  let companies = getData('companies');
  let comp = companies.find(c => c.id === compId);
  let tx = comp.transactions.find(t => t.id === txId);
  
  editingTxId = txId;
  currentCompanyId = compId;
  
  document.getElementById('editModalAmount').value = tx.amt;
  document.getElementById('editModalDesc').value = tx.desc;
  document.getElementById('editDebtModal').style.display = 'flex';
}

function saveEditDebt() {
  let newAmt = parseFloat(document.getElementById('editModalAmount').value);
  let newDesc = document.getElementById('editModalDesc').value;
  
  let companies = getData('companies');
  let comp = companies.find(c => c.id === currentCompanyId);
  let tx = comp.transactions.find(t => t.id === editingTxId);
  
  if(tx.type === 'add') comp.debt -= tx.amt;
  else comp.debt += tx.amt;
  
  tx.amt = newAmt;
  tx.desc = newDesc;
  
  if(tx.type === 'add') comp.debt += tx.amt;
  else comp.debt -= tx.amt;
  
  saveData('companies', companies);
  document.getElementById('editDebtModal').style.display = 'none';
  openCompanyProfile(currentCompanyId);
}
</script>
