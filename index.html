<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulsho Kaab Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-10">
    <!-- Header -->
    <header class="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">Bulsho Kaab Pro</h1>
            <div class="bg-emerald-800 p-1 rounded-lg flex text-xs">
                <button onclick="setCurrency('USD')" id="currUSD" class="px-3 py-1 bg-white text-emerald-800 rounded shadow">USD</button>
                <button onclick="setCurrency('SOS')" id="currSOS" class="px-3 py-1 text-white">SOS</button>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">
        <!-- Dashboard -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-emerald-500">
                <p class="text-[10px] text-slate-400 font-bold uppercase">Wadarta Iibka</p>
                <h3 id="totalSales" class="text-emerald-700 font-bold text-lg">USD 0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-rose-500">
                <p class="text-[10px] text-slate-400 font-bold uppercase">Wadarta Deynta</p>
                <h3 id="totalDebt" class="text-rose-700 font-bold text-lg">USD 0</h3>
            </div>
        </div>

        <!-- Home Grid -->
        <div id="homeView" class="grid grid-cols-2 gap-3">
            <button onclick="openSection('sales')" class="bg-white p-5 rounded-xl shadow text-center hover:bg-slate-50 transition">
                <div class="text-2xl mb-1">📈</div>
                <p class="font-bold text-sm">Iibka</p>
            </button>
            <button onclick="openSection('debt')" class="bg-white p-5 rounded-xl shadow text-center hover:bg-slate-50 transition border border-blue-100">
                <div class="text-2xl mb-1">👥</div>
                <p class="font-bold text-sm">Macaamiisha & Deen</p>
            </button>
        </div>

        <!-- Debt Section -->
        <div id="sectionDebt" class="hidden space-y-4">
            <button onclick="goHome()" class="text-xs bg-slate-200 px-3 py-1 rounded-lg">← Dib ugu noqo</button>
            <div class="bg-white p-4 rounded-xl shadow">
                <form onsubmit="saveDebt(event)" id="debtForm" class="space-y-3">
                    <input type="text" id="debtName" placeholder="Magaca Macmiilka" required class="w-full p-2 border rounded-lg text-sm">
                    <input type="number" step="0.01" id="debtAmount" placeholder="Cadadka Lacagta" required class="w-full p-2 border rounded-lg text-sm">
                    <select id="debtType" class="w-full p-2 border rounded-lg text-sm">
                        <option value="plus">Deyn Lagu Yeeshay (+)</option>
                        <option value="minus">Lacag uu Keenay (-)</option>
                    </select>
                    <button class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">Kaydi</button>
                </form>
            </div>
            <div id="debtsList" class="space-y-2"></div>
        </div>
    </main>

    <script>
        let debts = JSON.parse(localStorage.getItem('debts')) || [];
        let sales = JSON.parse(localStorage.getItem('sales')) || [];
        let curr = 'USD';

        function updateUI() {
            const dSum = debts.reduce((acc, d) => d.type === 'plus' ? acc + parseFloat(d.amt) : acc - parseFloat(d.amt), 0);
            const sSum = sales.reduce((acc, s) => acc + parseFloat(s.amt), 0);
            document.getElementById('totalDebt').innerText = `${curr} ${dSum}`;
            document.getElementById('totalSales').innerText = `${curr} ${sSum}`;
            
            const list = document.getElementById('debtsList');
            list.innerHTML = debts.map((d, i) => `
                <div class="bg-white p-3 rounded-lg shadow flex justify-between items-center text-sm">
                    <div>
                        <p class="font-bold">${d.name}</p>
                        <p class="${d.type === 'plus' ? 'text-rose-600' : 'text-emerald-600'} font-semibold">${d.type === 'plus' ? '+' : '-'} ${d.amt}</p>
                    </div>
                    <button onclick="delDebt(${i})" class="text-rose-400">🗑️</button>
                </div>
            `).join('');
        }

        function saveDebt(e) {
            e.preventDefault();
            debts.unshift({ name: document.getElementById('debtName').value, amt: document.getElementById('debtAmount').value, type: document.getElementById('debtType').value });
            localStorage.setItem('debts', JSON.stringify(debts));
            document.getElementById('debtForm').reset();
            updateUI();
        }

        function delDebt(i) { debts.splice(i, 1); localStorage.setItem('debts', JSON.stringify(debts)); updateUI(); }
        function openSection(s) { document.getElementById('homeView').classList.add('hidden'); document.getElementById('sectionDebt').classList.remove('hidden'); }
        function goHome() { document.getElementById('homeView').classList.remove('hidden'); document.getElementById('sectionDebt').classList.add('hidden'); }
        function setCurrency(c) { curr = c; updateUI(); }
        
        updateUI();
    </script>
</body>
</html>
